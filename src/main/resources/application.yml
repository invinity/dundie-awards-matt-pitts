springdoc:
  api-docs:
    path: /openapi
server:
  port: 3000
spring:
  jta:
    enabled: true
  datasource:
    url: jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;AUTOCOMMIT=OFF
    username: sa
    password: password
    driverClassName: org.h2.Driver
    type: org.h2.jdbcx.JdbcDataSource
  # datasource:
  #  url: jdbc:postgresql://localhost:5432/postgres
  #  username: postgres
  #  password: xxxxxxxx
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      jakarta:
        persistence:
          transactionType: JTA
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        # dialect: org.hibernate.dialect.PostgreSQLDialect
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.AtomikosJtaPlatform
    hibernate:
      ddl-auto: update
  thymeleaf: # Thymeleaf
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: file:src/main/resources/static/
  web:
    resources:
      static-locations: file:src/main/resources/static/
      cache:
        period: 0
